<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مكتب أحمد محرم للتخليص الجمركي والاستشارات</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800;900&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
  :root{
    --navy:#0B1D3A;
    --navy-deep:#071224;
    --paper:#F6F3EC;
    --paper-2:#EFEAE0;
    --ink:#1B2130;
    --brass:#C6963C;
    --brass-light:#E0B968;
    --sea:#2F6F63;
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    font-family:'Cairo',sans-serif;
    background:var(--paper);
    color:var(--ink);
    margin:0;
  }
  .font-display{font-family:'Cairo',sans-serif; font-weight:800;}
  .eyebrow{
    font-family:'Tajawal',sans-serif;
    letter-spacing:.08em;
    font-weight:700;
  }
  .num{font-variant-numeric: tabular-nums;}

  /* Texture */
  .paper-texture{
    background-image:
      radial-gradient(circle at 1px 1px, rgba(11,29,58,0.06) 1px, transparent 0);
    background-size: 22px 22px;
  }

  /* Nav */
  .nav-link{position:relative; padding-bottom:4px;}
  .nav-link::after{
    content:"";
    position:absolute; right:0; bottom:0; height:2px; width:0;
    background:var(--brass);
    transition:width .25s ease;
  }
  .nav-link:hover::after{width:100%;}

  /* Seal / stamp signature element */
  .seal{
    width:150px; height:150px;
    border-radius:50%;
    border:2px solid var(--brass);
    display:flex; align-items:center; justify-content:center;
    position:relative;
    flex-shrink:0;
    background:
      repeating-conic-gradient(from 0deg, rgba(198,150,60,0.10) 0deg 3deg, transparent 3deg 12deg);
  }
  .seal::before{
    content:"";
    position:absolute; inset:10px;
    border:1px dashed rgba(198,150,60,0.65);
    border-radius:50%;
  }
  .seal-text{
    font-family:'Tajawal',sans-serif;
    font-weight:700;
    font-size:.72rem;
    color:var(--brass-light);
    text-align:center;
    line-height:1.5;
  }

  /* Ticket / manifest divider */
  .manifest-divider{
    border-top:2px dashed rgba(198,150,60,.55);
    position:relative;
  }
  .manifest-divider::before,
  .manifest-divider::after{
    content:"";
    position:absolute; top:-9px;
    width:18px; height:18px; border-radius:50%;
    background:var(--paper);
    border:2px dashed rgba(198,150,60,.55);
  }
  .manifest-divider::before{right:-9px;}
  .manifest-divider::after{left:-9px;}

  .card-hover{transition:transform .25s ease, box-shadow .25s ease;}
  .card-hover:hover{transform:translateY(-4px); box-shadow:0 20px 40px -20px rgba(11,29,58,.35);}

  .reveal{opacity:0; transform:translateY(18px); transition:opacity .6s ease, transform .6s ease;}
  .reveal.in{opacity:1; transform:translateY(0);}

  @media (prefers-reduced-motion: reduce){
    .reveal{opacity:1; transform:none; transition:none;}
    html{scroll-behavior:auto;}
  }

  #mobileMenu{transition:max-height .3s ease, opacity .3s ease;}

  a:focus-visible, button:focus-visible{
    outline:2px solid var(--brass);
    outline-offset:3px;
  }
</style>
</head>
<body>

  <!-- Header -->
  <header class="bg-[var(--navy)] text-white sticky top-0 z-50 shadow-lg shadow-black/10">
    <div class="max-w-6xl mx-auto px-6 py-4 flex justify-between items-center">
      <a href="#home" class="flex items-center gap-3">
        <span class="w-10 h-10 rounded-full border border-[var(--brass)] flex items-center justify-center">
          <i class="fa-solid fa-anchor text-[var(--brass-light)]"></i>
        </span>
        <span class="font-display text-lg tracking-wide">مكتب أحمد محرم</span>
      </a>
